name: ci
permissions:
  contents: read

on:
  push:
    branches:
     - master
     - next*

  pull_request:
    branches:
     - master
     - next*

jobs:
  resolve-scylla-version:
    # test against the latest scylla release (not unstable/master, since master builds are cleared from S3 once in a while)
    name: Resolve latest scylla release
    runs-on: ubuntu-latest
    outputs:
      scylla_version: ${{ steps.resolve.outputs.scylla_version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        enable-cache: true
    - name: Resolve latest scylla release
      id: resolve
      run: |
        version="release:$(uv run python -m ccmlib.utils.scylla_versions latest)"
        echo "Using scylla version: ${version}"
        echo "scylla_version=${version}" >> "$GITHUB_OUTPUT"
  ci-without-nix:
    name: CCM Integration tests
    needs: resolve-scylla-version
    uses: ./.github/workflows/integration-tests.yml
    with:
      scylla_version: ${{ needs.resolve-scylla-version.outputs.scylla_version }}
  ci-with-nix:
    name: CCM Integration tests (using Nix)
    needs: resolve-scylla-version
    uses: ./.github/workflows/nix.yml
    with:
      scylla_version: ${{ needs.resolve-scylla-version.outputs.scylla_version }}
  ci-docker:
    name: Docker/Podman Integration tests
    uses: ./.github/workflows/docker-tests.yml
