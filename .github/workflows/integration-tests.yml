name: CCM Integration tests

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      scylla_version:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Setup java
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Install dependencies
      run: |
        uv sync

    - name: Cache binary versions
      id: cache-versions
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.ccm/repository
          ~/.ccm/scylla-repository
        key: ${{ runner.os }}-${{ inputs.scylla_version }}-binaries

    - name: Set environmental variables
      run: |
        echo "SCYLLA_VERSION=${{ inputs.scylla_version }}" >> "$GITHUB_ENV"

    - name: Download versions
      if: steps.cache-versions.outputs.cache-hit != 'true'
      run: |
        uv run ./ccm create temp -n 1 --scylla --version $SCYLLA_VERSION
        uv run ./ccm remove

    - name: Test with pytest
      run: |
        uv run python -m pytest ./tests -x -m "not docker"

    - name: Copy logs/results
      if: contains(github.event.pull_request.labels.*.name, 'PR-upload-log')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ccm-tests-log
        path: tests/test_results/
